[project]
name = "network-threat-detection"
version = "1.0.0"
description = "A reproducible machine-learning workflow for network traffic classification."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "joblib>=1.3", "numpy>=1.26", "pandas>=2.1",
  "plotly>=5.18", "pydantic>=2.6", "scikit-learn>=1.4",
  "streamlit>=1.32", "uvicorn[standard]>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
